<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">The top-six sweep and the wildcard twist</title><desc id="desc">Six teams won, but only five record berths qualify. Taaha leads the points wildcard with 1,010.56 points.</desc><rect width="1200" height="640" fill="#eee7d6"/><path d="M40 48H1160M40 586H1160" stroke="#20241e" stroke-width="5"/><text x="60" y="95" fill="#54604c" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="5">THE AMBERWOOD TIMES / WEEK 07</text><text x="56" y="189" fill="#20241e" font-family="Georgia,serif" font-size="88" font-weight="700">SIX WINS.</text><text x="56" y="281" fill="#20241e" font-family="Georgia,serif" font-size="88" font-weight="700">FIVE RECORD BERTHS.</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="60" y="329" width="690" height="187" rx="8" fill="#263b30"/><text x="405" y="368" fill="#d5c89d" font-size="20" letter-spacing="3">THE TOP HALF SWEPT THE CARD</text><g fill="#fff9e9" font-size="42" font-weight="700"><text x="125" y="429">7–0</text><text x="235" y="429">6–1</text><text x="345" y="429">5–2</text><text x="455" y="429">5–2</text><text x="565" y="429">4–3</text><text x="675" y="429">4–3</text></g><g fill="#fff9e9" font-size="16"><text x="125" y="467">ROSHIK</text><text x="235" y="467">PRANAV J</text><text x="345" y="467">PRANAV P</text><text x="455" y="467">ANUDEEP</text><text x="565" y="467">ANKITH</text><text x="675" y="467">ABHIRAM</text></g></g><g transform="translate(788 329)"><rect width="352" height="187" rx="8" fill="#a43d2b"/><text x="176" y="38" text-anchor="middle" font-family="Arial,sans-serif" fill="#ffecd4" font-size="20" font-weight="700" letter-spacing="3">THE SIDE ENTRANCE</text><text x="176" y="96" text-anchor="middle" font-family="Georgia,serif" fill="white" font-size="49" font-weight="700">TAAHA · 2–5</text><text x="176" y="142" text-anchor="middle" font-family="Arial,sans-serif" fill="#ffecd4" font-size="25">1,010.56 PF · Wildcard leader</text></g><text x="60" y="562" font-family="Arial,sans-serif" font-size="20" fill="#54604c">After Week 7 • Current playoff picture, not clinched berths</text></svg>
